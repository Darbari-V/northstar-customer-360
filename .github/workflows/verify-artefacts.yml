name: Verify complete artefact pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'data/**', 'web/**', 'scripts/**', 'assets/reader.css', '*.html', 'requirements-site.txt', '.github/workflows/verify-artefacts.yml']
  pull_request:
    paths: ['docs/**', 'data/**', 'web/**', 'scripts/**', 'assets/reader.css', '*.html', 'requirements-site.txt', '.github/workflows/verify-artefacts.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site.txt
      - run: python scripts/build_artefacts.py --check
